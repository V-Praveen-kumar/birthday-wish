<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Terminal 🎉</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: #00ffcc;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* Terminal box */
.terminal {
    width: 90%;
    max-width: 600px;
    background: #111;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,255,200,0.2);
}

/* Title */
h1 {
    color: #00ffcc;
    margin-bottom: 10px;
}

/* Button */
button {
    background: transparent;
    border: 1px solid #00ffcc;
    color: #00ffcc;
    padding: 10px 20px;
    cursor: pointer;
    margin-top: 20px;
}

/* Hidden sections */
#countdown, #content {
    display: none;
}

/* Typing */
#typing {
    margin-top: 20px;
    line-height: 1.5;
    border-right: 2px solid #00ffcc;
    padding-right: 5px;
    animation: blink 1s infinite;
}

/* Cursor blink */
@keyframes blink {
    50% { border-color: transparent; }
}

/* Music */
.music {
    position: absolute;
    top: 20px;
    right: 20px;
    color: #00ffcc;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="music" onclick="toggleMusic()">[ music ]</div>

<audio id="bgMusic" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-sunny.mp3">
</audio>

<div class="terminal" id="start">
    <p>> initializing birthday protocol...</p>
    <p>> target: Susanna</p>
    <button onclick="startCountdown()">[ EXECUTE ]</button>
</div>

<div class="terminal" id="countdown">
    <h1 id="count">3</h1>
</div>

<div class="terminal" id="content">
    <h1>> Happy Birthday Susanna 🎂</h1>
    <p id="typing"></p>
    <p style="opacity:0.6; margin-top:20px;">> from praveen</p>
</div>

<script>
// Countdown
function startCountdown() {
    document.getElementById("start").style.display = "none";
    document.getElementById("countdown").style.display = "block";

    let count = 3;
    let interval = setInterval(() => {
        count--;
        document.getElementById("count").innerText = count;

        if (count === 0) {
            clearInterval(interval);
            document.getElementById("countdown").style.display = "none";
            document.getElementById("content").style.display = "block";
            startTyping();
        }
    }, 1000);
}

// Typing effect
const message = "> Not just another year...\n> but another chapter of your story.\n> stay rare. stay real. stay you. ❤️";
let i = 0;

function startTyping() {
    let typing = document.getElementById("typing");
    let interval = setInterval(() => {
        typing.innerHTML += message.charAt(i);
        i++;
        if (i >= message.length) clearInterval(interval);
    }, 40);
}

// Music toggle
function toggleMusic() {
    let music = document.getElementById("bgMusic");
    if (music.paused) music.play();
    else music.pause();
}
</script>

</body>
</html>
