<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Terminal 🎉</title>

<style>

body{
margin:0;
background:#000;
color:#00ffcc;
font-family:Courier New, monospace;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
position:relative;
}

/* COLLAGE */

.collage{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

display:grid;
grid-template-columns:repeat(4,1fr);

gap:8px;
padding:8px;

opacity:0.45;
z-index:0;
}

.collage img{
width:100%;
height:100%;
object-fit:cover;

border-radius:8px;

filter:grayscale(20%) brightness(0.55);
}

/* OVERLAY */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.35);
z-index:1;
}

/* MATRIX */

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:2;
pointer-events:none;
}

/* TERMINAL */

.terminal{
position:relative;
z-index:3;

width:90%;
max-width:650px;

background:rgba(0,0,0,0.78);

padding:25px;
border-radius:10px;

box-shadow:0 0 20px rgba(0,255,200,0.2);

backdrop-filter:blur(5px);
}

/* TITLE */

h1{
color:#00ffcc;
font-size:42px;
margin-bottom:20px;
}

/* BUTTON */

button{
background:transparent;
border:1px solid #00ffcc;
color:#00ffcc;

padding:10px 20px;

cursor:pointer;

margin-top:20px;

font-family:Courier New, monospace;
}

button:hover{
background:#00ffcc;
color:black;
}

/* HIDDEN */

#countdown,
#content{
display:none;
}

/* TYPING */

#typing{
margin-top:20px;
line-height:1.8;
white-space:pre-line;

border-right:2px solid #00ffcc;

animation:blink 1s infinite;

font-size:18px;
}

@keyframes blink{
50%{
border-color:transparent;
}
}

/* MOBILE */

@media(max-width:480px){

.collage{
grid-template-columns:repeat(3,1fr);
}

h1{
font-size:24px;
}

.terminal{
font-size:14px;
padding:20px;
width:92%;
}

#typing{
font-size:15px;
}

}

</style>
</head>

<body>

<!-- COLLAGE -->

<div class="collage">

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">
<img src="photo6.jpg">
<img src="photo7.jpg">
<img src="photo8.jpg">
<img src="photo9.jpg">
<img src="photo10.jpg">
<img src="photo11.jpg">
<img src="photo12.jpg">
<img src="photo13.jpg">
<img src="photo14.jpg">
<img src="photo15.jpg">

</div>

<div class="overlay"></div>

<!-- MATRIX -->

<canvas id="matrix"></canvas>

<!-- START -->

<div class="terminal" id="start">

<p id="boot"></p>

<button onclick="startCountdown()">
[ EXECUTE ]
</button>

</div>

<!-- COUNTDOWN -->

<div class="terminal" id="countdown">
<h1 id="count">3</h1>
</div>

<!-- CONTENT -->

<div class="terminal" id="content">

<h1>
> Happy Birthday Susanna 🎂
</h1>

<p id="typing"></p>

<p style="opacity:0.6;margin-top:20px;">
> from praveen ❤️
</p>

</div>

<script>

/* MATRIX */

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let letters="SUSANNA";
letters=letters.split("");

let fontSize=16;

let columns=canvas.width/fontSize;

let drops=[];

for(let i=0;i<columns;i++){
drops[i]=1;
}

function draw(){

ctx.fillStyle="rgba(0,0,0,0.04)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#00ffcc";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){

let text=
letters[Math.floor(Math.random()*letters.length)];

ctx.fillText(
text,
i*fontSize,
drops[i]*fontSize
);

if(
drops[i]*fontSize>canvas.height &&
Math.random()>0.975
){
drops[i]=0;
}

drops[i]++;
}

}

setInterval(draw,35);

window.addEventListener("resize",()=>{

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

});

/* BOOT */

const boot=[
"> booting system...",
"> connecting to server...",
"> locating Susanna...",
"> access granted ✅"
];

let line=0;

function bootText(){

if(line<boot.length){

document.getElementById("boot").innerHTML+=
boot[line]+"<br>";

line++;

setTimeout(bootText,500);

}

}

bootText();

/* COUNTDOWN */

function startCountdown(){

document.getElementById("start").style.display="none";

document.getElementById("countdown").style.display="block";

let count=3;

let interval=setInterval(()=>{

count--;

document.getElementById("count").innerText=count;

if(count===0){

clearInterval(interval);

document.getElementById("countdown").style.display="none";

document.getElementById("content").style.display="block";

startTyping();

}

},1000);

}

/* TYPING */

const message=`> Not just another year...
but another chapter of your story.

> May time be gentle with your beautiful heart,
> and may I always find reasons to make you smile.

> If somehow I become the reason to gash your heart,
> may that be my last moment beside you.

> Stay rare. Stay real. Stay you. ❤️`;

let i=0;

function startTyping(){

let typing=document.getElementById("typing");

let interval=setInterval(()=>{

typing.innerHTML+=message.charAt(i);

i++;

if(i>=message.length){
clearInterval(interval);
}

},35);

}

</script>

</body>
</html>
