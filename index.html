<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Terminal 🎉</title>

<style>

body {
    margin: 0;
    background: #0a0a0a;
    color: #00ffcc;
    font-family: "Courier New", monospace;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
    width: 100%;
    overflow: hidden;
    position: relative;
}

/* PHOTO COLLAGE */

.collage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 8px;
    padding: 8px;

    z-index: 0;
    opacity: 0.12;
}

.collage img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    border-radius: 8px;

    filter: grayscale(100%) brightness(0.45);
}

/* DARK OVERLAY */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 1;
}

/* MATRIX */

#matrix {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
}

/* TERMINAL */

.terminal {
    position: relative;
    z-index: 3;

    width: 90%;
    max-width: 600px;

    background: rgba(17,17,17,0.88);
    padding: 25px;
    border-radius: 10px;

    box-shadow: 0 0 25px rgba(0,255,200,0.2);

    backdrop-filter: blur(6px);
}

/* TITLE */

h1 {
    position: relative;
    color: #00ffcc;
}

h1::after {
    content: attr(data-text);
    position: absolute;
    left: 2px;
    top: 0;
    color: red;
    opacity: 0.3;
}

/* BUTTON */

button {
    background: transparent;
    border: 1px solid #00ffcc;
    color: #00ffcc;
    padding: 10px 20px;
    cursor: pointer;
    margin-top: 20px;
    transition: 0.3s;
}

button:hover {
    background: #00ffcc;
    color: black;
}

/* HIDDEN */

#countdown,
#content {
    display: none;
}

/* TYPING */

#typing {
    margin-top: 20px;
    line-height: 1.5;
    border-right: 2px solid #00ffcc;
    padding-right: 5px;
    animation: blink 1s infinite;
    white-space: pre-line;
}

@keyframes blink {
    50% {
        border-color: transparent;
    }
}

/* MUSIC */

.music {
    position: absolute;
    top: 20px;
    right: 20px;
    color: #00ffcc;
    cursor: pointer;
    z-index: 4;
}

/* MOBILE */

@media (max-width: 480px) {

    .terminal {
        padding: 20px;
        font-size: 14px;
    }

    h1 {
        font-size: 18px;
    }

    .collage {
        grid-template-columns: repeat(3, 1fr);
    }
}

</style>
</head>

<body>

<!-- PHOTO COLLAGE -->

<div class="collage">

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">
<img src="photo6.jpg">
<img src="photo7.jpg">
<img src="photo8.jpg">
<img src="photo9.jpg">
<img src="photo10.jpg">
<img src="photo11.jpg">
<img src="photo12.jpg">
<img src="photo13.jpg">
<img src="photo14.jpg">
<img src="photo15.jpg">

</div>

<div class="overlay"></div>

<!-- MATRIX -->

<canvas id="matrix"></canvas>

<!-- MUSIC -->

<div class="music" onclick="toggleMusic()">
[ music ]
</div>

<audio id="bgMusic" loop>
<source src="https://www.bensound.com/bensound-music/bensound-sunny.mp3">
</audio>

<!-- START -->

<div class="terminal" id="start">

<p id="boot"></p>

<button onclick="startCountdown()">
[ EXECUTE ]
</button>

</div>

<!-- COUNTDOWN -->

<div class="terminal" id="countdown">
<h1 id="count">3</h1>
</div>

<!-- CONTENT -->

<div class="terminal" id="content">

<h1 data-text="> Happy Birthday Susanna 🎂">
> Happy Birthday Susanna 🎂
</h1>

<p id="typing"></p>

<p style="opacity:0.6; margin-top:20px;">
> from praveen
</p>

</div>

<script>

/* MATRIX */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

let letters = "01".split("");

let fontSize = 14;

let columns = Math.floor(canvas.width / fontSize);

let drops = [];

for (let i = 0; i < columns; i++) {
    drops[i] = 1;
}

function drawMatrix() {

    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ffcc";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {

        let text =
        letters[Math.floor(Math.random() * letters.length)];

        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (
            drops[i] * fontSize > canvas.height &&
            Math.random() > 0.975
        ) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(drawMatrix, 35);

/* BOOT TEXT */

const bootText = [

"> booting system...",
"> connecting to server...",
"> locating Susanna...",
"> access granted ✅"

];

let line = 0;

function typeBoot() {

    if (line < bootText.length) {

        document.getElementById("boot").innerHTML +=
        bootText[line] + "<br>";

        line++;

        setTimeout(typeBoot, 500);
    }
}

typeBoot();

/* COUNTDOWN */

function startCountdown() {

    document.getElementById("start").style.display = "none";

    document.getElementById("countdown").style.display = "block";

    let count = 3;

    let interval = setInterval(() => {

        count--;

        document.getElementById("count").innerText = count;

        if (count === 0) {

            clearInterval(interval);

            document.getElementById("countdown").style.display = "none";

            document.getElementById("content").style.display = "block";

            startTyping();
        }

    }, 1000);
}

/* TYPING */

const message = `> Not just another year...
> but another chapter of your story.
> stay rare. stay real. stay you. ❤️`;

let i = 0;

function startTyping() {

    let typing = document.getElementById("typing");

    let interval = setInterval(() => {

        typing.innerHTML += message.charAt(i);

        i++;

        if (i >= message.length) {
            clearInterval(interval);
        }

    }, 40);
}

/* MUSIC */

function toggleMusic() {

    let music = document.getElementById("bgMusic");

    if (music.paused) {
        music.play();
    }

    else {
        music.pause();
    }
}

</script>

</body>
</html>
