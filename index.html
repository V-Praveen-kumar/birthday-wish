<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 🎉</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

#content {
    display: none;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    background: gold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

h1 {
    font-size: 40px;
}
</style>
</head>

<body>

<div id="start">
    <button onclick="showWish()">Tap to see your surprise 🎁</button>
</div>

<div id="content">
    <h1>🎉 Happy Birthday 🎂</h1>
    <p>This is your special day ✨</p>
    <p>Keep shining and smiling always ❤️</p>
</div>

<script>
function showWish() {
    document.getElementById("start").style.display = "none";
    document.getElementById("content").style.display = "block";
}
</script>

</body>
</html>
