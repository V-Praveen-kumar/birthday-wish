<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Terminal 🎉</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
font-family:"Courier New",monospace;
height:100vh;
width:100vw;
display:flex;
justify-content:center;
align-items:center;
position:relative;
color:#00ffcc;
}

/* ───────── COLLAGE ───────── */

.collage{
position:fixed;
inset:0;

display:grid;
grid-template-columns:repeat(4,1fr);
grid-auto-rows:25vh;

gap:4px;
padding:4px;

z-index:0;
}

.collage img{
width:100%;
height:100%;
object-fit:cover;

filter:
brightness(0.55)
contrast(1.05)
grayscale(15%);

border-radius:6px;
}

/* ───────── DARK OVERLAY ───────── */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.25);
z-index:1;
}

/* ───────── MATRIX ───────── */

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:2;
pointer-events:none;
}

/* ───────── TERMINAL ───────── */

.terminal{
position:relative;
z-index:3;

width:90%;
max-width:700px;

background:rgba(0,0,0,0.72);

border:1px solid rgba(0,255,204,0.25);

backdrop-filter:blur(8px);

padding:30px;
border-radius:12px;

box-shadow:
0 0 20px rgba(0,255,204,0.18),
0 0 60px rgba(0,0,0,0.5);
}

h1{
font-size:52px;
margin-bottom:20px;
text-shadow:0 0 10px rgba(0,255,204,0.4);
}

#typing{
font-size:20px;
line-height:2;
white-space:pre-line;
min-height:220px;
}

.cursor{
display:inline-block;
width:10px;
height:1.2em;
background:#00ffcc;

animation:blink 1s infinite;
vertical-align:bottom;
}

@keyframes blink{
50%{
opacity:0;
}
}

.from{
margin-top:20px;
opacity:0.6;
font-size:15px;
}

/* ───────── BUTTON ───────── */

button{
margin-top:20px;

padding:12px 24px;

background:transparent;
border:1px solid #00ffcc;

color:#00ffcc;

font-family:"Courier New",monospace;
cursor:pointer;

transition:0.25s;
}

button:hover{
background:#00ffcc;
color:#000;
}

/* ───────── SCREENS ───────── */

#countdown,
#content{
display:none;
}

#count{
font-size:100px;
text-align:center;
}

/* ───────── MOBILE ───────── */

@media(max-width:768px){

.collage{
grid-template-columns:repeat(3,1fr);
grid-auto-rows:20vh;
}

h1{
font-size:28px;
}

#typing{
font-size:15px;
line-height:1.8;
min-height:260px;
}

.terminal{
padding:20px;
width:94%;
}

#count{
font-size:70px;
}

}

</style>
</head>

<body>

<!-- COLLAGE -->

<div class="collage">

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">
<img src="photo6.jpg">
<img src="photo7.jpg">
<img src="photo8.jpg">
<img src="photo9.jpg">
<img src="photo10.jpg">
<img src="photo11.jpg">
<img src="photo12.jpg">
<img src="photo13.jpg">
<img src="photo14.jpg">
<img src="photo15.jpg">

</div>

<div class="overlay"></div>

<!-- MATRIX -->

<canvas id="matrix"></canvas>

<!-- START SCREEN -->

<div class="terminal" id="start">

<div id="boot"></div>

<button onclick="startCountdown()">
[ EXECUTE ]
</button>

</div>

<!-- COUNTDOWN -->

<div class="terminal" id="countdown">
<div id="count">3</div>
</div>

<!-- MESSAGE -->

<div class="terminal" id="content">

<h1>
&gt; Happy Birthday Susanna 🎂
</h1>

<div id="typing"></div>

<div class="from">
&gt; from praveen ❤️
</div>

</div>

<script>

/* ───────── MATRIX RAIN ───────── */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "SUSANNA".split("");

const fontSize = 16;

const columns = canvas.width / fontSize;

const drops = [];

for(let i = 0; i < columns; i++){
drops[i] = 1;
}

function drawMatrix(){

ctx.fillStyle = "rgba(0,0,0,0.04)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "#00ffcc";
ctx.font = fontSize + "px monospace";

for(let i = 0; i < drops.length; i++){

const text =
letters[Math.floor(Math.random() * letters.length)];

ctx.fillText(
text,
i * fontSize,
drops[i] * fontSize
);

if(
drops[i] * fontSize > canvas.height &&
Math.random() > 0.975
){
drops[i] = 0;
}

drops[i]++;
}

}

setInterval(drawMatrix,35);

window.addEventListener("resize",()=>{

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

});

/* ───────── BOOT TEXT ───────── */

const bootLines = [

"> initializing system...",
"> decrypting memories...",
"> locating Susanna...",
"> preparing birthday protocol...",
"> access granted ✅"

];

let line = 0;

function bootSequence(){

if(line < bootLines.length){

document.getElementById("boot").innerHTML +=
bootLines[line] + "<br>";

line++;

setTimeout(bootSequence,500);

}

}

bootSequence();

/* ───────── COUNTDOWN ───────── */

function startCountdown(){

document.getElementById("start").style.display = "none";

document.getElementById("countdown").style.display = "block";

let count = 3;

document.getElementById("count").innerText = count;

let interval = setInterval(()=>{

count--;

if(count === 0){

document.getElementById("count").innerText = "🎂";

setTimeout(()=>{

clearInterval(interval);

document.getElementById("countdown").style.display = "none";

document.getElementById("content").style.display = "block";

startTyping();

},900);

}else{

document.getElementById("count").innerText = count;

}

},1000);

}

/* ───────── TYPING EFFECT ───────── */

const message = `> Not just another year...
but another chapter of your story.

> May time be gentle with your beautiful heart,
> and may I always find reasons to make you smile.

> If somehow I become the reason to gash your heart,
> may that be my last moment beside you.

> Stay rare. Stay real. Stay you. ❤️`;

function startTyping(){

const el = document.getElementById("typing");

const cursor = document.createElement("span");

cursor.className = "cursor";

el.appendChild(cursor);

let i = 0;

let interval = setInterval(()=>{

el.insertBefore(
document.createTextNode(message.charAt(i)),
cursor
);

i++;

if(i >= message.length){
clearInterval(interval);
}

},32);

}

</script>

</body>
</html>
